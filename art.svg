<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" id="lz-door" class="lz-door" role="img" aria-labelledby="lz-door-title">
<title id="lz-door-title">Louise the librarian waving hello, a navy book in the crook of her arm</title>
<!--
  lz-door: Louise standing in her office door, turned three-quarters toward you and looking at you. Transparent background (the
  office paints the room behind her), a soft shadow ellipse at her feet. Same character model as the desk scenes: silver bun with a
  yellow pencil, big square tortoiseshell glasses on a gilt chain, bottle-green cardigan over a cream blouse with a rounded collar,
  gilt brooch with a garnet, a plain oxblood A-line skirt, dark stockings, brown low shoes. Her weight rests on one leg, her head tips
  a little, a navy book rides in the crook of one arm and the other hand waves at about shoulder height.
  Parts: lz-door-shadow, lz-door-body (legs, shoes, skirt, cardigan, blouse, collar), lz-door-head (face, hair, glasses, chain),
  lz-door-arms (the book arm and the waving arm).
  Motion: .lz-door-wave rotates her raised forearm and hand about the elbow, 2 s ease-in-out loop (about -10 to +6 degrees).
  Reduced motion stops it; the still pose is the resting wave. Every id and rule is scoped lz-door / #lz-door.
-->
<style>
#lz-door .lz-door-wave{transform-box:view-box;transform-origin:141px 98px;animation:lz-door-wave 2s ease-in-out infinite}
@keyframes lz-door-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-10deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){#lz-door *{animation:none !important}}
</style>
