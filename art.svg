<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" id="lz-door" class="lz-door" role="img" aria-labelledby="lz-door-title">
<title id="lz-door-title">Louise the librarian waving hello, a navy book in the crook of her arm</title>
<!--
  lz-door: Louise as a collectible vinyl-toy figure, standing square to you in her office door. Transparent background (the office
  paints the room behind her), a soft shadow ellipse under her feet. This is THE character model the other scenes copy.
  Proportions: the head (x 48 to 152, y 22 to 118, a rounded square tilted 4 degrees) is bigger than the whole small body (y 116 to 207).
  Head: moulded silver hair cap with a side-swept fringe of three smooth lumps and side panels, a round bun with a chunky yellow pencil
  through it, oversized square tortoiseshell glasses (panes x 57 to 95 and 105 to 143, y 58 to 92) with big cartoon eyes that fill
  the panes (brown irises, catch-lights, a relaxed skin lid), a glass tint and one glossy glare band per lens, a tiny smile and blush.
  A gilt beaded chain leaves each temple, swings outside the head and droops under the chin.
  Body: bottle-green cardigan over a cream blouse with a two-lobe collar, gilt buttons and a garnet brooch, a plain oxblood A-line skirt,
  stubby legs, rounded nub shoes. Stubby sleeve arms with mitt hands: one holds a navy book in the crook of her arm, the other waves.
  Shading: flat fills, one shadow shape per part (light from the upper left), a soft highlight on the hair, glossy dots on bun and shoes.
  Parts: lz-door-shadow, lz-door-body, lz-door-head (with lz-door-glasses and lz-door-chain), lz-door-arms, lz-door-wave.
  Motion: .lz-door-wave rotates the raised forearm and hand about the elbow, 2 s ease-in-out loop (about -10 to +6 degrees).
  Reduced motion stops it; the still pose is the resting wave. Every id and rule is scoped lz-door / #lz-door.
-->
<style>
#lz-door .lz-door-wave{transform-box:view-box;transform-origin:158px 138px;animation:lz-door-wave 2s ease-in-out infinite}
@keyframes lz-door-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-10deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){#lz-door *{animation:none !important}}
</style>
